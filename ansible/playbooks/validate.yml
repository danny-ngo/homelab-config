- name: Validate the Linux baseline
  hosts: linux_nodes
  gather_facts: true
  tasks:
    - name: Run baseline role validation
      ansible.builtin.include_role:
        name: "{{ item }}"
        tasks_from: validate
      loop: [common, storage, firewall]

- name: Validate workstations
  hosts: workstations
  gather_facts: true
  tasks:
    - name: Run workstation role validation
      ansible.builtin.include_role:
        name: "{{ item }}"
        tasks_from: validate
      loop: [workstation, tailscale, dotfiles]

- name: Validate infrastructure hosts
  hosts: infra_hosts
  gather_facts: true
  tasks:
    - name: Run infrastructure role validation
      ansible.builtin.include_role:
        name: "{{ item }}"
        tasks_from: validate
      loop: [infra_host, tailscale, dotfiles]

- name: Validate execution nodes
  hosts: execution_nodes
  gather_facts: true
