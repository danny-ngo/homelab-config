all:
  vars:
    ansible_user: homelab
    ansible_become: true
    timezone: America/Toronto
    local_domain: homelab.test
    lan_cidr: 192.0.2.0/24
    management_networks: [192.0.2.0/24]
    emergency_resolvers: [1.1.1.1, 9.9.9.9]
    administrator_public_keys:
      - ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIFAKEEXAMPLEONLY homelab
    ssh_recovery_access_confirmed: false
    ssh_hardening_enabled: false
    k3s_cluster_cidr: 10.42.0.0/16
    k3s_service_cidr: 10.43.0.0/16
  children:
    workstations:
      hosts:
        macbook:
          ansible_host: 192.0.2.10
          ansible_connection: local
          ansible_python_interpreter: "{{ ansible_playbook_python }}"
          expected_os_family: Darwin
          expected_architecture: arm64
    infra_hosts:
      hosts:
        thinkpad:
          ansible_host: 192.0.2.11
          expected_os_family: Debian
          expected_architecture: x86_64
          tailscale_tag: tag:infra
          k3s_node_address: 192.0.2.11
    execution_nodes:
      hosts:
        thinkcentre:
          ansible_host: 192.0.2.12
          expected_os_family: Archlinux
          expected_architecture: x86_64
          tailscale_tag: tag:execution-node
    pihole_nodes:
      hosts:
        pi2:
          ansible_host: 192.0.2.33
          expected_os_family: Debian
          expected_architecture: armv7l
          pihole_interface: eth0
          # Replace these documentation defaults with the selected policy.
          pihole_upstream_resolvers: [1.1.1.1, 9.9.9.9]
    pi1_wol_nodes:
      hosts:
        pi1wol:
          ansible_host: 192.0.2.34
          expected_os_family: Debian
          expected_architecture: armv6l
          pi1_wol_targets:
            - name: thinkpad
              mac_address: 00:00:5e:00:53:11
              broadcast_address: 192.0.2.255
            - name: thinkcentre
              mac_address: 00:00:5e:00:53:12
              broadcast_address: 192.0.2.255
    pi1_probe_nodes:
      hosts:
        pi1probe:
          ansible_host: 192.0.2.35
          expected_os_family: Debian
          expected_architecture: armv6l
          pi1_probe_targets:
            - name: thinkpad
              address: 192.0.2.11
              healthchecks_url: >-
                {{ vault_pi1_probe_healthchecks_urls[inventory_hostname]['thinkpad'] }}
            - name: thinkcentre
              address: 192.0.2.12
              healthchecks_url: >-
                {{ vault_pi1_probe_healthchecks_urls[inventory_hostname]['thinkcentre'] }}
          pi1_probe_heartbeat_url: >-
            {{ vault_pi1_probe_healthchecks_urls[inventory_hostname]['probe'] }}
    k3s_servers:
      hosts:
        thinkpad: {}
    k3s_workers_supported:
      hosts:
        pi3a:
          ansible_host: 192.0.2.31
          expected_os_family: Debian
          expected_architecture: aarch64
          k3s_node_address: 192.0.2.31
        pi3b:
          ansible_host: 192.0.2.32
          expected_os_family: Debian
          expected_architecture: aarch64
          k3s_node_address: 192.0.2.32
    linux_nodes:
      vars:
        # Initial bootstrap installs this distribution interpreter explicitly.
        # The user's uv-managed 3.14 is for user workloads, not Ansible modules.
        ansible_python_interpreter: /usr/bin/python3
      children:
        infra_hosts: {}
        execution_nodes: {}
        pihole_nodes: {}
        k3s_workers_supported: {}
    non_raspberry_pi_linux:
      children:
        infra_hosts: {}
        execution_nodes: {}
    tailscale_nodes:
      children:
        infra_hosts: {}
        execution_nodes: {}
    k3s_cluster:
      children:
        k3s_servers: {}
        k3s_workers_supported: {}
    pi1_edge_nodes:
      vars:
        # ARMv6 is a documented exception to the uv-managed Python contract.
        ansible_python_interpreter: /usr/bin/python3
      children:
        pi1_wol_nodes: {}
        pi1_probe_nodes: {}
