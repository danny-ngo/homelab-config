- name: Create the Homebrew configuration directory
  ansible.builtin.file:
    path: "/Users/{{ workstation_user }}/.config/homebrew"
    state: directory
    mode: '0755'
  become: false

- name: Copy the reviewed workstation Brewfile
  ansible.builtin.copy:
    src: "{{ playbook_dir }}/../packages/macos/Brewfile"
    dest: "/Users/{{ workstation_user }}/.config/homebrew/Brewfile"
    mode: '0644'
  become: false

- name: Check workstation packages against the Brewfile
  ansible.builtin.command:
    argv:
      - brew
      - bundle
      - check
      - "--file=/Users/{{ workstation_user }}/.config/homebrew/Brewfile"
  register: workstation_brew_bundle_check
  changed_when: false
  failed_when: false
  check_mode: false
  become: false
  environment:
    HOMEBREW_NO_AUTO_UPDATE: '1'

- name: Install missing workstation packages from the Brewfile
  ansible.builtin.command:
    argv:
      - brew
      - bundle
      - install
      - "--file=/Users/{{ workstation_user }}/.config/homebrew/Brewfile"
  when:
    - workstation_brew_bundle_check.rc != 0
    - not ansible_check_mode
  changed_when: true
  become: false
  environment:
    HOMEBREW_NO_AUTO_UPDATE: '1'

- name: Create the workstation mise configuration directory
  ansible.builtin.file:
    path: "/Users/{{ workstation_user }}/.config/mise"
    state: directory
    owner: "{{ workstation_user }}"
    mode: '0755'
- name: Render the workstation mise configuration
  ansible.builtin.template:
    src: mise-config.toml.j2
    dest: "/Users/{{ workstation_user }}/.config/mise/config.toml"
    owner: "{{ workstation_user }}"
    mode: '0644'
- name: Install workstation mise-managed tool versions
  ansible.builtin.command: mise install
  become_user: "{{ workstation_user }}"
  become: true
  environment:
    HOME: "/Users/{{ workstation_user }}"
  changed_when: false
- name: Install workstation developer CLIs
  ansible.builtin.command:
    argv: >-
      {{
        ['mise', 'exec', 'node@' ~ mise_node_version, '--', 'npm', 'install', '--global']
        + workstation_developer_cli_packages
      }}
  become: false
  environment:
    HOME: "/Users/{{ workstation_user }}"
  changed_when: false
