- name: Verify the pinned K3s artifact is defined for this architecture
  ansible.builtin.assert:
    that:
      - ansible_facts["architecture"] in k3s_binary_assets
      - ansible_facts["architecture"] in k3s_binary_checksums
      - k3s_binary_checksums[ansible_facts["architecture"]] | length == 64
    fail_msg: >-
      No verified K3s {{ k3s_version }} artifact is configured for
      {{ ansible_facts["architecture"] }}.

- name: Create the K3s configuration directory
  ansible.builtin.file:
    path: /etc/rancher/k3s
    state: directory
    owner: root
    group: root
    mode: "0700"

- name: Install the checksum-verified K3s server binary
  ansible.builtin.get_url:
    url: >-
      {{ 'https://github.com/k3s-io/k3s/releases/download/' ~ k3s_version ~ '/'
         ~ k3s_binary_assets[ansible_facts["architecture"]] }}
    dest: /usr/local/bin/k3s
    checksum: "sha256:{{ k3s_binary_checksums[ansible_facts['architecture']] }}"
    owner: root
    group: root
    mode: "0755"
  notify: Restart K3s server

- name: Render the K3s server configuration
  ansible.builtin.template:
    src: config.yaml.j2
    dest: /etc/rancher/k3s/config.yaml
    owner: root
    group: root
    mode: "0600"
  notify: Restart K3s server

- name: Install the K3s server systemd unit
  ansible.builtin.template:
    src: k3s.service.j2
    dest: /etc/systemd/system/k3s.service
    owner: root
    group: root
    mode: "0644"
  notify:
    - Reload systemd
    - Restart K3s server

- name: Enable and start the K3s server
  ansible.builtin.systemd_service:
    name: k3s
    enabled: true
    state: started
    daemon_reload: true

- name: Wait for the K3s join token
  ansible.builtin.stat:
    path: "{{ k3s_data_dir }}/server/node-token"
  register: k3s_node_token_file
  until: k3s_node_token_file.stat.exists
  retries: 30
  delay: 2
  no_log: true

- name: Read the K3s join token for this playbook run
  ansible.builtin.slurp:
    src: "{{ k3s_data_dir }}/server/node-token"
  register: k3s_node_token_content
  no_log: true

- name: Keep the K3s join token only in memory
  ansible.builtin.set_fact:
    k3s_runtime_node_token: "{{ k3s_node_token_content.content | b64decode | trim }}"
    cacheable: false
  no_log: true
