- name: Verify the Wake-on-LAN host and repetition settings
  ansible.builtin.assert:
    that:
      - ansible_os_family == 'Debian'
      - expected_os_family | default('') == 'Debian'
      - wol_targets | length > 0
      - >-
        wol_targets | map(attribute='name') | unique | length
        == wol_targets | length
      - wol_default_port >= 1
      - wol_default_port <= 65535
      - wol_repeat_count >= 1
      - wol_repeat_count <= 10
      - wol_repeat_interval_seconds >= 0
      - wol_repeat_interval_seconds <= 10
    fail_msg: >-
      The Wake-on-LAN role requires a Debian-family host, at least one uniquely
      named target, and bounded packet repetition settings.

- name: Verify each Wake-on-LAN target
  ansible.builtin.assert:
    that:
      - item.name is match('^[a-z][a-z0-9-]*$')
      - item.mac_address is match('^(?:[0-9A-Fa-f]{2}:){5}[0-9A-Fa-f]{2}$')
      - >-
        item.broadcast_address
        | default(wol_default_broadcast_address)
        | length > 0
      - >-
        item.broadcast_address
        | default(wol_default_broadcast_address)
        | ipv4_address_valid
      - item.port | default(wol_default_port) | int >= 1
      - item.port | default(wol_default_port) | int <= 65535
    fail_msg: >-
      Each Wake-on-LAN target needs a filename-safe unique name, a colon-form
      MAC address, a numeric broadcast address, and a valid UDP port.
  loop: "{{ wol_targets }}"
  loop_control:
    label: "{{ item.name | default('invalid target') }}"

- name: Install the Wake-on-LAN client
  ansible.builtin.package:
    name: wakeonlan
    state: present

- name: Install fixed Wake-on-LAN target commands
  ansible.builtin.template:
    src: wake-target.sh.j2
    dest: "/usr/local/bin/wake-{{ item.name }}"
    owner: root
    group: root
    mode: "0755"
  loop: "{{ wol_targets }}"
  loop_control:
    label: "{{ item.name }}"
