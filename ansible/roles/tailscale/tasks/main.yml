- name: Install the Tailscale app on macOS
  community.general.homebrew_cask: {name: tailscale-app, state: present}
  when: ansible_os_family == 'Darwin'

- name: Ensure the Debian package keyring directory exists
  ansible.builtin.file:
    path: /usr/share/keyrings
    state: directory
    owner: root
    group: root
    mode: "0755"
  when: ansible_os_family == 'Debian'

- name: Install the Tailscale Debian repository key
  ansible.builtin.get_url:
    url: "{{ tailscale_apt_keyring_url }}"
    dest: /usr/share/keyrings/tailscale-archive-keyring.gpg
    owner: root
    group: root
    mode: "0644"
  register: tailscale_apt_keyring
  when: ansible_os_family == 'Debian'

- name: Install the Tailscale Debian repository definition
  ansible.builtin.get_url:
    url: "{{ tailscale_apt_repository_url }}"
    dest: /etc/apt/sources.list.d/tailscale.list
    owner: root
    group: root
    mode: "0644"
  register: tailscale_apt_repository
  when: ansible_os_family == 'Debian'

- name: Refresh APT after changing the Tailscale repository
  ansible.builtin.apt:
    update_cache: true
  when:
    - ansible_os_family == 'Debian'
    - tailscale_apt_keyring.changed or tailscale_apt_repository.changed

- name: Install Tailscale on Linux
  ansible.builtin.package: {name: tailscale, state: present}
  when: ansible_os_family != 'Darwin'
- name: Enable and start Tailscale on Linux
  ansible.builtin.service: {name: tailscaled, enabled: true, state: started}
  when: ansible_os_family != 'Darwin'

- name: Inspect the Linux Tailscale backend state
  ansible.builtin.command:
    argv: [tailscale, status, --json]
  register: tailscale_status
  changed_when: false
  failed_when: false
  check_mode: false
  when: ansible_os_family != 'Darwin' and tailscale_tag is defined

- name: Resolve the Linux Tailscale backend state
  ansible.builtin.set_fact:
    tailscale_backend_state: >-
      {{
        (tailscale_status.stdout | from_json).BackendState
        if tailscale_status.rc == 0 and tailscale_status.stdout is match('^\s*\{')
        else 'Unknown'
      }}
  when: ansible_os_family != 'Darwin' and tailscale_tag is defined

- name: Verify unattended Tailscale enrollment credentials
  ansible.builtin.assert:
    that:
      - vault_tailscale_auth_keys is defined
      - inventory_hostname in (vault_tailscale_auth_keys | default({}))
      - vault_tailscale_auth_keys[inventory_hostname] | length > 0
      - vault_tailscale_auth_keys[inventory_hostname] != 'REPLACE_ME'
    fail_msg: >-
      Add a valid auth key for {{ inventory_hostname }} to
      vault_tailscale_auth_keys in the encrypted production vault.
  no_log: true
  when:
    - ansible_os_family != 'Darwin'
    - tailscale_tag is defined
    - tailscale_backend_state in ['NeedsLogin', 'NoState', 'Unknown']

- name: Enroll an unauthenticated Linux Tailscale node
  when:
    - ansible_os_family != 'Darwin'
    - tailscale_tag is defined
    - tailscale_backend_state in ['NeedsLogin', 'NoState', 'Unknown']
  block:
    - name: Stage the Tailscale auth key outside the process arguments
      ansible.builtin.copy:
        content: "{{ vault_tailscale_auth_keys[inventory_hostname] }}"
        dest: "{{ tailscale_auth_key_path }}"
        owner: root
        group: root
        mode: "0600"
      no_log: true

    - name: Connect Tailscale with the staged auth key
      ansible.builtin.command:
        argv:
          - tailscale
          - up
          - "--auth-key=file:{{ tailscale_auth_key_path }}"
          - "--accept-dns={{ tailscale_accept_dns | bool | ternary('true', 'false') }}"
          - "--ssh={{ tailscale_ssh | bool | ternary('true', 'false') }}"
          - "--advertise-tags={{ tailscale_tag }}"
          - "--timeout={{ tailscale_up_timeout }}"
      no_log: true
      changed_when: true
  always:
    - name: Remove the staged Tailscale auth key
      ansible.builtin.file:
        path: "{{ tailscale_auth_key_path }}"
        state: absent
      no_log: true

- name: Connect Tailscale and reapply complete Linux preferences
  ansible.builtin.command:
    argv:
      - tailscale
      - up
      - "--accept-dns={{ tailscale_accept_dns | bool | ternary('true', 'false') }}"
      - "--ssh={{ tailscale_ssh | bool | ternary('true', 'false') }}"
      - "--advertise-tags={{ tailscale_tag }}"
      - "--timeout={{ tailscale_up_timeout }}"
  no_log: true
  when:
    - ansible_os_family != 'Darwin'
    - tailscale_tag is defined
    - tailscale_backend_state not in ['NeedsLogin', 'NoState', 'Unknown']
  changed_when: tailscale_backend_state != 'Running'
