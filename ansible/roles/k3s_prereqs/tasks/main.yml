- name: Verify K3s topology, host, and network prerequisites
  ansible.builtin.assert:
    that:
      - groups.get('k3s_servers', []) | length == 1
      - groups.get('k3s_servers', []) | intersect(groups.get('k3s_workers_supported', [])) | length == 0
      - ansible_service_mgr == 'systemd'
      - ansible_memtotal_mb >= k3s_minimum_memory_mb
      - ansible_architecture != 'armv6l'
      - k3s_cluster_cidr | cidr_valid
      - k3s_service_cidr | cidr_valid
      - not (k3s_cluster_cidr | cidr_overlaps(k3s_service_cidr))
      - not (lan_cidr | cidr_overlaps(k3s_cluster_cidr))
    fail_msg: >-
      K3s requires exactly one server, disjoint server/worker groups, systemd,
      supported resources and architecture, and non-overlapping LAN, pod, and service networks.
- name: Enable IPv4 forwarding for K3s
  ansible.posix.sysctl: {name: net.ipv4.ip_forward, value: '1', state: present}
