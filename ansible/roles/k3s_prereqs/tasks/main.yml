- name: Verify K3s topology, host, and network prerequisites
  ansible.builtin.assert:
    that:
      - groups.get('k3s_servers', []) | length == 1
      - groups.get('k3s_servers', []) | intersect(groups.get('k3s_workers_supported', [])) | length == 0
      - ansible_facts["service_mgr"] == 'systemd'
      - >-
        ansible_facts["memtotal_mb"] >= (
          k3s_server_minimum_memory_mb
          if inventory_hostname in groups.get('k3s_servers', [])
          else k3s_agent_minimum_memory_mb
        )
      - ansible_facts["architecture"] != 'armv6l'
      - k3s_cluster_cidr | cidr_valid
      - k3s_service_cidr | cidr_valid
      - not (k3s_cluster_cidr | cidr_overlaps(k3s_service_cidr))
      - not (lan_cidr | cidr_overlaps(k3s_cluster_cidr))
    fail_msg: >-
      K3s requires exactly one server, disjoint server/worker groups, systemd,
      the role-appropriate memory minimum, supported architecture, and
      non-overlapping LAN, pod, and service networks.

- name: Inspect active Linux cgroup controllers
  ansible.builtin.slurp:
    src: /proc/cgroups
  register: k3s_proc_cgroups

- name: Verify the memory cgroup controller is enabled
  ansible.builtin.assert:
    that:
      - >-
        (k3s_proc_cgroups.content | b64decode).splitlines()
        | select('match', '^memory\\s+\\d+\\s+\\d+\\s+1$')
        | list
        | length == 1
    fail_msg: >-
      K3s needs the memory cgroup controller. On Raspberry Pi OS, append
      cgroup_memory=1 cgroup_enable=memory to /boot/firmware/cmdline.txt
      (/boot/cmdline.txt on Debian 11 and older), reboot, and rerun this play.

- name: Enable IPv4 forwarding for K3s
  ansible.posix.sysctl: {name: net.ipv4.ip_forward, value: '1', state: present}
