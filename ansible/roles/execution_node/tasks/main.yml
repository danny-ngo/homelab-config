- name: Install execution-node packages
  ansible.builtin.package:
    name: "{{ execution_node_packages }}"
    state: present
  register: execution_node_package_install
- name: Set the execution-node user's login shell
  ansible.builtin.user:
    name: "{{ execution_node_user }}"
    shell: "{{ login_shell }}"
  when: not ansible_check_mode or not execution_node_package_install.changed
- name: Create the Docker configuration directory
  ansible.builtin.file:
    path: /etc/docker
    state: directory
    owner: root
    group: root
    mode: "0755"
- name: Configure bounded Docker logs and live restore
  ansible.builtin.template:
    src: daemon.json.j2
    dest: /etc/docker/daemon.json
    owner: root
    group: root
    mode: "0644"
  notify: Restart Docker
  when: not ansible_check_mode or not execution_node_package_install.changed
- name: Enable and start Docker
  ansible.builtin.service: {name: docker, enabled: true, state: started}
  when: not ansible_check_mode or not execution_node_package_install.changed
- name: Grant the execution-node user Docker access
  ansible.builtin.user: {name: "{{ execution_node_user }}", groups: docker, append: true}
  when: not ansible_check_mode or not execution_node_package_install.changed
- name: Create the mise configuration directory
  ansible.builtin.file:
    path: "/home/{{ execution_node_user }}/.config/mise"
    state: directory
    owner: "{{ execution_node_user }}"
    mode: '0755'
- name: Render the execution-node mise configuration
  ansible.builtin.template:
    src: mise-config.toml.j2
    dest: "/home/{{ execution_node_user }}/.config/mise/config.toml"
    owner: "{{ execution_node_user }}"
    mode: '0644'
- name: Install mise-managed tool versions
  ansible.builtin.command: mise install
  become_user: "{{ execution_node_user }}"
  become: true
  environment:
    HOME: "/home/{{ execution_node_user }}"
  changed_when: false
- name: Install execution-node developer CLIs
  ansible.builtin.command:
    argv: >-
      {{
        ['mise', 'exec', 'node@' ~ mise_node_version, '--', 'npm', 'install', '--global']
        + execution_node_developer_cli_packages
      }}
  become_user: "{{ execution_node_user }}"
  become: true
  environment:
    HOME: "/home/{{ execution_node_user }}"
  changed_when: false
- name: Create the T3 Code workspace and state directories
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    owner: "{{ execution_node_user }}"
    group: "{{ execution_node_user }}"
    mode: '0750'
  loop:
    - "/home/{{ execution_node_user }}/src"
    - "{{ t3_code_data_dir }}"
- name: Allow the execution-node user to manage Tailscale Serve
  ansible.builtin.command:
    argv: [tailscale, set, "--operator={{ execution_node_user }}"]
  changed_when: false
- name: Read the execution-node user's numeric ID
  ansible.builtin.command:
    argv: [id, --user, "{{ execution_node_user }}"]
  register: execution_node_user_id
  changed_when: false
- name: Inspect the legacy T3 Code system service
  ansible.builtin.stat:
    path: "{{ t3_code_legacy_service_path }}"
  register: t3_code_legacy_service
- name: Stop and disable the legacy T3 Code system service
  ansible.builtin.systemd_service:
    name: "{{ t3_code_legacy_service_name }}"
    enabled: false
    state: stopped
  when:
    - not ansible_check_mode
    - t3_code_legacy_service.stat.exists
- name: Remove the legacy T3 Code system service
  ansible.builtin.file:
    path: "{{ t3_code_legacy_service_path }}"
    state: absent
  register: t3_code_legacy_service_removal
  when: not ansible_check_mode
- name: Reload systemd after removing the legacy T3 Code service
  ansible.builtin.systemd_service:
    daemon_reload: true
  when:
    - not ansible_check_mode
    - t3_code_legacy_service_removal.changed | default(false)
- name: Enable persistent user services for the execution-node user
  ansible.builtin.command:
    argv: [loginctl, enable-linger, "{{ execution_node_user }}"]
  changed_when: false
  when: not ansible_check_mode
- name: Start the execution-node user's systemd manager
  ansible.builtin.systemd_service:
    name: "user@{{ execution_node_user_id.stdout }}.service"
    state: started
  when: not ansible_check_mode
- name: Install or update the T3 Code background service
  ansible.builtin.command:
    argv:
      - mise
      - exec
      - "node@{{ mise_node_version }}"
      - --
      - npx
      - --yes
      - "t3@{{ t3_code_version }}"
      - service
      - update
      - --base-dir
      - "{{ t3_code_data_dir }}"
  become_user: "{{ execution_node_user }}"
  become: true
  environment:
    HOME: "/home/{{ execution_node_user }}"
    XDG_RUNTIME_DIR: "/run/user/{{ execution_node_user_id.stdout }}"
    DBUS_SESSION_BUS_ADDRESS: >-
      unix:path=/run/user/{{ execution_node_user_id.stdout }}/bus
  register: t3_code_service_update
  changed_when: >-
    t3_code_service_update.stdout is
    regex('^(Installed|Updated) T3 Code service')
  when: not ansible_check_mode
- name: Inspect the T3 Code Tailscale Serve configuration
  ansible.builtin.command:
    argv: [tailscale, serve, status, --json]
  register: t3_code_tailscale_serve_status
  changed_when: false
  check_mode: false
- name: Publish T3 Code through private Tailscale Serve
  ansible.builtin.command:
    argv:
      - tailscale
      - serve
      - --bg
      - --yes
      - "--https={{ t3_code_tailscale_serve_port }}"
      - "http://127.0.0.1:{{ t3_code_port }}"
  changed_when: true
  when:
    - not ansible_check_mode
    - >-
      not (
        (
          (t3_code_tailscale_serve_status.stdout | from_json)
          .get('TCP', {})
          .get(t3_code_tailscale_serve_port | string, {})
          .get('HTTPS', false)
        )
        and
        (
          'http://127.0.0.1:' ~ (t3_code_port | string)
          in t3_code_tailscale_serve_status.stdout
        )
      )
- name: Report execution-node security and operator actions
  ansible.builtin.debug:
    msg: >-
      Docker group membership grants root-equivalent access. Python is uv-managed;
      Node, Go, Rust, and Herdr are mise-managed. GitHub CLI, Codex, and OpenCode
      authentication and T3 client pairing remain operator actions. Tailscale
      Serve is managed by Ansible. Keep the T3 client and server on exactly
      t3@{{ t3_code_version }}. Project
      repositories under ~/src require reviewed commits and frequent pushes to
      GitHub; Ansible does not automatically commit or push working trees.
