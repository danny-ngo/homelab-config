- name: Install execution-node packages
  ansible.builtin.package:
    name: "{{ execution_node_packages }}"
    state: present
- name: Configure bounded Docker logs and live restore
  ansible.builtin.template:
    src: daemon.json.j2
    dest: /etc/docker/daemon.json
    owner: root
    group: root
    mode: "0644"
  notify: Restart Docker
- name: Enable and start Docker
  ansible.builtin.service: {name: docker, enabled: true, state: started}
- name: Grant the execution-node user Docker access
  ansible.builtin.user: {name: "{{ execution_node_user }}", groups: docker, append: true}
- name: Create the mise configuration directory
  ansible.builtin.file:
    path: "/home/{{ execution_node_user }}/.config/mise"
    state: directory
    owner: "{{ execution_node_user }}"
    mode: '0755'
- name: Render the execution-node mise configuration
  ansible.builtin.template:
    src: mise-config.toml.j2
    dest: "/home/{{ execution_node_user }}/.config/mise/config.toml"
    owner: "{{ execution_node_user }}"
    mode: '0644'
- name: Install mise-managed tool versions
  ansible.builtin.command: mise install
  become_user: "{{ execution_node_user }}"
  become: true
  environment:
    HOME: "/home/{{ execution_node_user }}"
  changed_when: false
- name: Install execution-node developer CLIs
  ansible.builtin.command:
    argv: >-
      {{
        ['mise', 'exec', 'node@' ~ mise_node_version, '--', 'npm', 'install', '--global']
        + execution_node_developer_cli_packages
      }}
  become_user: "{{ execution_node_user }}"
  become: true
  environment:
    HOME: "/home/{{ execution_node_user }}"
  changed_when: false
- name: Create the T3 Code workspace and state directories
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    owner: "{{ execution_node_user }}"
    group: "{{ execution_node_user }}"
    mode: '0750'
  loop:
    - "/home/{{ execution_node_user }}/src"
    - "/home/{{ execution_node_user }}/.local/share/t3code"
- name: Allow the execution-node user to manage Tailscale Serve
  ansible.builtin.command:
    argv: [tailscale, set, "--operator={{ execution_node_user }}"]
  changed_when: false
- name: Install the T3 Code headless systemd service
  ansible.builtin.template:
    src: t3-code.service.j2
    dest: /etc/systemd/system/t3-code.service
    owner: root
    group: root
    mode: '0644'
  notify: Restart T3 Code
- name: Enable and start T3 Code
  ansible.builtin.systemd_service:
    name: t3-code
    enabled: true
    state: started
    daemon_reload: true
- name: Report execution-node security and operator actions
  ansible.builtin.debug:
    msg: >-
      Docker group membership grants root-equivalent access. Python is uv-managed;
      Node, Go, and Rust are mise-managed. Codex and OpenCode authentication and
      T3 Code client pairing remain operator actions. Project repositories under
      ~/src require reviewed commits and frequent pushes to GitHub; Ansible does
      not automatically commit or push working trees.
