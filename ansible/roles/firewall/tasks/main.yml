- name: Install UFW on Debian-family hosts
  ansible.builtin.package: {name: ufw, state: present}
  when: ansible_facts["os_family"] == 'Debian'
- name: Permit SSH from management networks with UFW
  community.general.ufw:
    rule: allow
    port: '22'
    proto: tcp
    from_ip: "{{ item }}"
  loop: "{{ management_networks }}"
  when: ansible_facts["os_family"] == 'Debian' and firewall_enabled | bool
- name: Install firewalld on Arch-family hosts
  ansible.builtin.package: {name: firewalld, state: present}
  register: firewall_firewalld_package
  when: ansible_facts["os_family"] == 'Archlinux'
- name: Enable firewalld on Arch-family hosts
  ansible.builtin.service: {name: firewalld, enabled: true, state: started}
  when:
    - ansible_facts["os_family"] == 'Archlinux'
    - firewall_enabled | bool
    - >-
      not ansible_check_mode
      or not (firewall_firewalld_package.changed | default(false))
