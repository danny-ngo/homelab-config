- name: Inspect the K3s agent configuration
  ansible.builtin.stat: {path: /etc/rancher/k3s/config.yaml}
  register: k3s_agent_config

- name: Read K3s agent service state
  ansible.builtin.service_facts:

- name: Verify the K3s agent is secured and running
  ansible.builtin.assert:
    that:
      - k3s_agent_config.stat.mode == '0600'
      - ansible_facts.services['k3s-agent.service'].status == 'enabled'
      - ansible_facts.services['k3s-agent.service'].state == 'running'
    quiet: true
