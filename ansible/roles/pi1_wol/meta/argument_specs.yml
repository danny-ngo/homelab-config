argument_specs:
  main:
    options:
      pi1_wol_targets:
        type: list
        elements: dict
        required: true
        options:
          name: {type: str, required: true}
          mac_address: {type: str, required: true}
          broadcast_address: {type: str}
          port: {type: int}
      pi1_wol_default_broadcast_address: {type: str}
      pi1_wol_default_port: {type: int}
      pi1_wol_repeat_count: {type: int}
      pi1_wol_repeat_interval_seconds: {type: int}
