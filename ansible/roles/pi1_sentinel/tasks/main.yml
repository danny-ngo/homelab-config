- name: Verify the Pi 1 sentinel platform and timing
  ansible.builtin.assert:
    that:
      - ansible_facts["os_family"] == 'Debian'
      - ansible_facts["architecture"] == 'armv6l'
      - ansible_facts["service_mgr"] == 'systemd'
      - expected_os_family | default('') == 'Debian'
      - expected_architecture | default('') == 'armv6l'
      - pi1_sentinel_dns_server is match('^[A-Za-z0-9][A-Za-z0-9._:-]*$')
      - pi1_sentinel_dns_query_name is match('^[A-Za-z0-9][A-Za-z0-9.-]*$')
      - pi1_sentinel_http_url is match('^https?://\\S+$')
      - pi1_sentinel_interval_seconds >= 15
      - pi1_sentinel_interval_seconds <= 3600
      - pi1_sentinel_dns_timeout_seconds >= 1
      - pi1_sentinel_dns_timeout_seconds <= 30
      - pi1_sentinel_http_timeout_seconds >= 1
      - pi1_sentinel_http_timeout_seconds <= 60
      - pi1_sentinel_boot_media_gb >= 8
      - pi1_sentinel_user is match('^[a-z_][a-z0-9_-]*$')
    fail_msg: >-
      The sentinel role requires a systemd-based Debian ARMv6 system, safe DNS
      and HTTP check inputs, at least 8 GB boot media, and bounded check timing.

- name: Verify vaulted sentinel Healthchecks URLs
  ansible.builtin.assert:
    that:
      - item in pi1_sentinel_healthchecks_urls
      - pi1_sentinel_healthchecks_urls[item] is match('^https://\\S+$')
      - pi1_sentinel_healthchecks_urls[item] != 'REPLACE_ME'
    fail_msg: >-
      Add unique HTTPS Healthchecks ping URLs for dns_udp, dns_tcp, http, and
      sentinel to vault_pi1_sentinel_healthchecks_urls in the encrypted
      production vault.
  loop: [dns_udp, dns_tcp, http, sentinel]
  no_log: true

- name: Install sentinel runtime packages
  ansible.builtin.package:
    name: [curl, dnsutils]
    state: present

- name: Create the unprivileged sentinel account
  ansible.builtin.user:
    name: "{{ pi1_sentinel_user }}"
    system: true
    create_home: false
    home: /nonexistent
    shell: /usr/sbin/nologin

- name: Check whether the sentinel account already exists
  ansible.builtin.command:
    argv: [getent, passwd, "{{ pi1_sentinel_user }}"]
  register: pi1_sentinel_account
  changed_when: false
  failed_when: false
  check_mode: false

- name: Create the protected sentinel configuration directory
  ansible.builtin.file:
    path: "{{ pi1_sentinel_config_dir }}"
    state: directory
    owner: root
    group: "{{ pi1_sentinel_user }}"
    mode: "0750"
  when: pi1_sentinel_account.rc == 0

- name: Render sentinel service settings
  ansible.builtin.template:
    src: settings.tsv.j2
    dest: "{{ pi1_sentinel_config_dir }}/settings.tsv"
    owner: root
    group: "{{ pi1_sentinel_user }}"
    mode: "0640"
  when: pi1_sentinel_account.rc == 0
  notify: Restart Pi 1 service sentinel

- name: Render protected sentinel heartbeat configuration
  ansible.builtin.template:
    src: heartbeats.tsv.j2
    dest: "{{ pi1_sentinel_config_dir }}/heartbeats.tsv"
    owner: root
    group: "{{ pi1_sentinel_user }}"
    mode: "0640"
  when: pi1_sentinel_account.rc == 0
  no_log: true
  notify: Restart Pi 1 service sentinel

- name: Install the service sentinel program
  ansible.builtin.template:
    src: pi1-service-sentinel.sh.j2
    dest: /usr/local/sbin/pi1-service-sentinel
    owner: root
    group: root
    mode: "0755"
  notify: Restart Pi 1 service sentinel

- name: Inspect the existing service sentinel unit
  ansible.builtin.stat:
    path: /etc/systemd/system/pi1-service-sentinel.service
  register: pi1_sentinel_existing_unit

- name: Install the service sentinel systemd unit
  ansible.builtin.template:
    src: pi1-service-sentinel.service.j2
    dest: /etc/systemd/system/pi1-service-sentinel.service
    owner: root
    group: root
    mode: "0644"
  notify: Restart Pi 1 service sentinel

- name: Enable and start the service sentinel
  ansible.builtin.systemd_service:
    name: pi1-service-sentinel.service
    enabled: true
    state: started
    daemon_reload: true
  when:
    - pi1_sentinel_account.rc == 0
    - pi1_sentinel_existing_unit.stat.exists or not ansible_check_mode
