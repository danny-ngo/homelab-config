title: Homelab configuration
description: >-
  Architecture decisions, installation guides, and operations runbooks for a
  rebuildable homelab.
url: https://danny-ngo.github.io
baseurl: /homelab-config
repository: danny-ngo/homelab-config

theme: minima

header_pages:
  - bootstrap-python-flow.md
  - agent-config-design.html
  - agent-config-repository-handoff.md
  - runbooks/dns.md
  - decisions/open-decisions.md

plugins:
  - jekyll-relative-links
  - jekyll-seo-tag

relative_links:
  enabled: true
  collections: true

titles_from_headings:
  enabled: false

strict_front_matter: true

# Internal planning documents are source material, not part of the published site.
exclude:
  - internal/
